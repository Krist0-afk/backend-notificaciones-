server:
  port: 8085

spring:
  application:
    name: backend-notificaciones

  security:
    oauth2:
      resourceserver:
        jwt:
          # Autodescubrimiento de Azure AD
          issuer-uri: https://login.microsoftonline.com/8ea291c8-4670-4598-8f0f-b5e216b5b755/v2.0
          audiences: c6445b4c-7863-42ac-a620-2fa3b5ea58d8

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificaciones_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

# Nombres de exchanges, colas y routing keys centralizados (ver RabbitMQProperties)
app:
  security:
    # Segundo proveedor de login (AWS Cognito)
    cognito:
      issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vZp9ZN52O}
      client-id: ${COGNITO_CLIENT_ID:348a4vr0o6i0ja8u5u7jes7tki}
  rabbitmq:
    exchanges:
      # Consume: orden creada (topic que publica órdenes)
      ordenes-topic: "ordenes.topic.exchange"
      # Consume: usuario creado (direct que publica usuarios)
      usuario-direct: "usuario.exchange"
      # Dead letter exchange propio de este microservicio
      dlx: "notificaciones.dlx.exchange"
    queues:
      orden-creada: "notificaciones.orden.creada.queue"
      orden-creada-dlq: "notificaciones.orden.creada.dlq"
      usuario-creado: "notificaciones.usuario.creado.queue"
      usuario-creado-dlq: "notificaciones.usuario.creado.dlq"
    routing-keys:
      orden-creada: "orden.creada.#"
      usuario-creado: "usuario.creado.key"
      orden-creada-dlq: "notificaciones.orden.dlq.key"
      usuario-creado-dlq: "notificaciones.usuario.dlq.key"

  # Remitente que aparece en los correos simulados
  mail:
    remitente: ${MAIL_FROM:no-reply@pedidos360.cl}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://3.213.91.126}
