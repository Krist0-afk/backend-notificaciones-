server:
  port: 8085

spring:
  application:
    name: backend-notificaciones
  
  security:
    oauth2:
      resourceserver:
        jwt:
          # Autodescubrimiento de Azure AD
          issuer-uri: https://login.microsoftonline.com/8ea291c8-4670-4598-8f0f-b5e216b5b755/v2.0
          audiences: c6445b4c-7863-42ac-a620-2fa3b5ea58d8

  datasource:
    # Base de datos conectada para AWS EC2
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificaciones_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  rabbitmq:
    # Conexión a RabbitMQ
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual # Exigencia de tu rúbrica

# Nombres de colas sincronizados con Órdenes
rabbitmq:
  exchange:
    principal: "orden.exchange"
  queue:
    principal: "orden.creada.queue"
    dlq: "orden.creada.dlq"
  routing-key:
    principal: "orden.creada.key"
    dlq: "orden.creada.dlq.key"