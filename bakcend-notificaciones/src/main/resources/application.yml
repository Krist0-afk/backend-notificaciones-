server:
  port: 8085

spring:
  application:
    name: backend-notificaciones
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificaciones_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual 


rabbitmq:
  exchange:
    principal: "usuario.exchange"
  queue:
    principal: "usuario.creado.queue"
    dlq: "usuario.creado.dlq"
  routing-key:
    principal: "usuario.creado.key"
    dlq: "usuario.creado.dlq.key"